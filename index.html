<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Baloo 2', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Canvas Confetti (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Animations to replace Framer Motion */
        .envelope-wrapper {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .envelope-hidden {
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            pointer-events: none;
            position: absolute;
        }
        .card-wrapper {
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            pointer-events: none;
            position: absolute;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            position: relative;
        }
    </style>
</head>
<body class="min-h-screen bg-pink-50 flex flex-col items-center justify-center p-4 font-sans overflow-hidden relative">

    <!-- Background decorations -->
    <div class="absolute top-10 left-10 text-pink-200 animate-pulse">
        <i data-lucide="heart" class="w-12 h-12 fill-current"></i>
    </div>
    <div class="absolute bottom-20 right-10 text-blue-200 animate-bounce">
        <i data-lucide="sparkles" class="w-12 h-12"></i>
    </div>
    <div class="absolute top-40 right-20 text-yellow-200 animate-pulse">
        <i data-lucide="heart" class="w-8 h-8 fill-current"></i>
    </div>

    <!-- Countdown Timer -->
    <div class="absolute top-8 bg-white/80 backdrop-blur-sm px-6 py-3 rounded-full shadow-sm border border-pink-100 z-10 animate-[fadeInDown_1s_ease-out]">
        <p class="text-pink-400 font-display font-bold text-lg text-center">
            Countdown to March 11th! 🎂
        </p>
        <div class="flex gap-3 text-pink-500 font-bold justify-center mt-1">
            <div class="flex flex-col items-center"><span id="days" class="text-2xl">0</span><span class="text-xs uppercase tracking-wider">Days</span></div>
            <span class="text-2xl">:</span>
            <div class="flex flex-col items-center"><span id="hours" class="text-2xl">00</span><span class="text-xs uppercase tracking-wider">Hrs</span></div>
            <span class="text-2xl">:</span>
            <div class="flex flex-col items-center"><span id="minutes" class="text-2xl">00</span><span class="text-xs uppercase tracking-wider">Min</span></div>
            <span class="text-2xl">:</span>
            <div class="flex flex-col items-center"><span id="seconds" class="text-2xl">00</span><span class="text-xs uppercase tracking-wider">Sec</span></div>
        </div>
    </div>

    <div class="w-full max-w-md relative mt-24 flex justify-center">
        
        <!-- Envelope -->
        <div id="envelope" class="envelope-wrapper cursor-pointer group w-full max-w-[320px]" onclick="openEnvelope()">
            <div class="bg-pink-200 rounded-2xl p-8 shadow-lg relative overflow-hidden aspect-[4/3] flex items-center justify-center border-4 border-white transition-transform group-hover:scale-105">
                <!-- Envelope Flap -->
                <div class="absolute top-0 left-0 w-full h-1/2 bg-pink-300 origin-top transform rotate-x-180" style="clip-path: polygon(0 0, 50% 100%, 100% 0)"></div>
                
                <div class="z-10 bg-white p-4 rounded-full shadow-md animate-bounce">
                    <i data-lucide="heart" class="text-pink-400 w-12 h-12 fill-current"></i>
                </div>
                
                <p class="absolute bottom-6 text-pink-600 font-display font-bold text-xl">Tap to open!</p>
            </div>
        </div>

        <!-- Birthday Card -->
        <div id="card" class="card-wrapper bg-white rounded-3xl p-8 shadow-xl border-4 border-pink-100 w-full">
            <div class="text-center space-y-6">
                <h1 class="font-display text-4xl text-pink-500 font-bold leading-tight">
                    Happy Birthday<br/>to my favorite person!
                </h1>
                
                <p class="text-gray-600 text-lg leading-relaxed">
                    Wishing you a day filled with as much joy, warmth, and coziness as you bring into my life.
                </p>

                <!-- Characters Section -->
                <div class="flex justify-center items-end gap-4 py-6 relative">
                    
                    <!-- Hachiware -->
                    <div class="relative flex flex-col items-center">
                        <div class="absolute -top-12 -left-8 bg-blue-50 text-blue-600 px-3 py-2 rounded-2xl rounded-br-none text-sm font-bold shadow-sm border border-blue-100 whitespace-nowrap z-10 animate-pulse">
                            Everything will be okay!
                        </div>
                        <img 
                            src="https://iili.io/qz58Bvp.png" 
                            alt="Hachiware" 
                            class="w-20 h-20 rounded-full border-4 border-blue-200 object-cover shadow-sm"
                            referrerpolicy="no-referrer"
                        />
                    </div>

                    <!-- Chiikawa -->
                    <div class="relative flex flex-col items-center z-10 transform -translate-y-4">
                        <img 
                            src="https://iili.io/qz5aIUv.md.png" 
                            alt="Chiikawa" 
                            class="w-24 h-24 rounded-full border-4 border-pink-200 object-cover shadow-md"
                            referrerpolicy="no-referrer"
                        />
                    </div>

                    <!-- Usagi -->
                    <div class="relative flex flex-col items-center">
                        <div class="absolute -top-10 -right-4 bg-yellow-50 text-yellow-600 px-3 py-2 rounded-2xl rounded-bl-none text-sm font-bold shadow-sm border border-yellow-100 whitespace-nowrap z-10 animate-bounce">
                            Ura!
                        </div>
                        <img 
                            src="https://iili.io/qz563Gt.png" 
                            alt="Usagi" 
                            class="w-20 h-20 rounded-full border-4 border-yellow-200 object-cover shadow-sm"
                            referrerpolicy="no-referrer"
                        />
                    </div>

                </div>

                <button 
                    onclick="triggerConfetti()"
                    class="bg-gradient-to-r from-pink-400 to-pink-500 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all active:scale-95 flex items-center justify-center gap-2 w-full text-lg"
                >
                    <i data-lucide="gift" class="w-6 h-6"></i>
                    Click for a Surprise!
                </button>
            </div>
        </div>

    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Envelope & Card Logic
        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            const card = document.getElementById('card');
            
            envelope.classList.add('envelope-hidden');
            
            setTimeout(() => {
                card.classList.remove('card-wrapper'); // remove hidden state class
                card.classList.add('card-visible');
            }, 300);
        }

        // Confetti Logic
        function triggerConfetti() {
            const duration = 3000;
            const end = Date.now() + duration;

            const frame = () => {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            };
            frame();
        }

        // Countdown Logic
        function updateTimer() {
            const now = new Date();
            let targetDate = new Date(now.getFullYear(), 2, 11); // Month is 0-indexed (2 = March)
            
            if (now > targetDate) {
                targetDate = new Date(now.getFullYear() + 1, 2, 11);
            }

            const difference = targetDate.getTime() - now.getTime();

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
                document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer(); // Initial call
    </script>
</body>
</html>
