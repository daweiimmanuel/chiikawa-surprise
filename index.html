<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Baloo 2', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Canvas Confetti (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Animations */
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) scale(1) rotate(360deg); opacity: 0; }
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg) scale(1.05); }
            25% { transform: rotate(-2deg) scale(1.05); }
            50% { transform: rotate(2deg) scale(1.05); }
            75% { transform: rotate(-2deg) scale(1.05); }
        }
        
        .hover-wiggle { transition: transform 0.3s; }
        .hover-wiggle:hover { animation: wiggle 0.6s ease-in-out infinite; }

        .envelope-wrapper { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .envelope-hidden {
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            pointer-events: none;
            position: absolute;
        }
        
        .card-wrapper {
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            pointer-events: none;
            position: absolute;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            position: relative;
        }

        /* Character Hover & Tap Effects */
        .char-hachiware, .char-usagi { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
        .char-hachiware:hover { transform: scale(1.1) rotate(-5deg); }
        .char-hachiware:active { transform: scale(0.9); }
        
        .char-usagi:hover { transform: scale(1.1) rotate(5deg); }
        .char-usagi:active { transform: scale(0.9); }

        .char-chiikawa { transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; transform: translateY(-1rem); }
        .char-chiikawa:hover { transform: translateY(-1.5rem) scale(1.15); }
        .char-chiikawa:active { transform: translateY(-1rem) scale(0.9); }

        .btn-bounce { transition: transform 0.2s; }
        .btn-bounce:hover { transform: scale(1.05); }
        .btn-bounce:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen bg-pink-50 flex flex-col items-center justify-center p-4 font-sans overflow-hidden relative">

    <!-- Floating Hearts Container -->
    <div id="floating-hearts" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Background decorations -->
    <div class="absolute top-10 left-10 text-pink-300 animate-pulse">
        <i data-lucide="heart" class="w-12 h-12 fill-current"></i>
    </div>
    <div class="absolute bottom-20 right-10 text-blue-300 animate-bounce">
        <i data-lucide="sparkles" class="w-12 h-12"></i>
    </div>
    <div class="absolute top-40 right-20 text-yellow-300 animate-pulse">
        <i data-lucide="star" class="w-8 h-8 fill-current"></i>
    </div>

    <!-- Countdown Timer -->
    <div class="absolute top-8 bg-white/80 backdrop-blur-sm px-6 py-3 rounded-full shadow-sm border border-pink-100 z-10 animate-[fadeInDown_1s_ease-out]">
        <p class="text-pink-400 font-display font-bold text-lg text-center">
            Countdown to March 11th! 🎂
        </p>
        <div class="flex gap-3 text-pink-500 font-bold justify-center mt-1">
            <div class="flex flex-col items-center"><span id="days" class="text-2xl">0</span><span class="text-xs uppercase tracking-wider">Days</span></div>
            <span class="text-2xl">:</span>
            <div class="flex flex-col items-center"><span id="hours" class="text-2xl">00</span><span class="text-xs uppercase tracking-wider">Hrs</span></div>
            <span class="text-2xl">:</span>
            <div class="flex flex-col items-center"><span id="minutes" class="text-2xl">00</span><span class="text-xs uppercase tracking-wider">Min</span></div>
            <span class="text-2xl">:</span>
            <div class="flex flex-col items-center"><span id="seconds" class="text-2xl">00</span><span class="text-xs uppercase tracking-wider">Sec</span></div>
        </div>
    </div>

    <div class="w-full max-w-md relative mt-24 flex justify-center z-10">
        
        <!-- Envelope -->
        <div id="envelope" class="envelope-wrapper cursor-pointer group w-full max-w-[320px]" onclick="openEnvelope()">
            <div class="bg-pink-200 rounded-2xl p-8 shadow-lg relative overflow-hidden aspect-[4/3] flex items-center justify-center border-4 border-white hover-wiggle">
                <!-- Envelope Flap -->
                <div class="absolute top-0 left-0 w-full h-1/2 bg-pink-300 origin-top transform rotate-x-180" style="clip-path: polygon(0 0, 50% 100%, 100% 0)"></div>
                
                <div class="z-10 bg-white p-4 rounded-full shadow-md animate-bounce">
                    <i data-lucide="heart" class="text-pink-400 w-12 h-12 fill-current"></i>
                </div>
                
                <p class="absolute bottom-6 text-pink-600 font-display font-bold text-xl">Special Delivery! 💌</p>
            </div>
        </div>

        <!-- Birthday Card -->
        <div id="card" class="card-wrapper bg-white rounded-3xl p-8 shadow-xl border-4 border-pink-100 w-full">
            <div class="text-center space-y-6">
                <h1 class="font-display text-4xl text-pink-500 font-bold leading-tight">
                    Happy Birthday<br/>to my favorite person!
                </h1>
                
                <p class="text-gray-600 text-lg leading-relaxed">
                    Wishing you a day filled with as much joy, warmth, and coziness as you bring into my life.
                </p>

                <!-- Characters Section -->
                <div class="flex justify-center items-end gap-4 py-6 relative">
                    
                    <!-- Hachiware -->
                    <div class="relative flex flex-col items-center char-hachiware" onclick="cycleText('hachiware')">
                        <div id="bubble-hachiware" class="absolute -top-12 -left-8 bg-blue-50 text-blue-600 px-3 py-2 rounded-2xl rounded-br-none text-sm font-bold shadow-sm border border-blue-100 whitespace-nowrap z-10 transition-all duration-200">
                            Everything will be okay!
                        </div>
                        <img 
                            src="https://iili.io/qz58Bvp.png" 
                            alt="Hachiware" 
                            class="w-20 h-20 rounded-full border-4 border-blue-200 object-cover shadow-sm pointer-events-none"
                            referrerpolicy="no-referrer"
                        />
                    </div>

                    <!-- Chiikawa -->
                    <div class="relative flex flex-col items-center z-10 char-chiikawa" onclick="cycleText('chiikawa')">
                        <div id="bubble-chiikawa" class="absolute -top-12 bg-pink-50 text-pink-600 px-3 py-2 rounded-2xl rounded-b-none text-sm font-bold shadow-sm border border-pink-100 whitespace-nowrap z-10 opacity-0 transition-all duration-200 transform scale-90">
                            Ehehe...
                        </div>
                        <img 
                            src="https://iili.io/qz5aIUv.md.png" 
                            alt="Chiikawa" 
                            class="w-24 h-24 rounded-full border-4 border-pink-200 object-cover shadow-md pointer-events-none"
                            referrerpolicy="no-referrer"
                        />
                    </div>

                    <!-- Usagi -->
                    <div class="relative flex flex-col items-center char-usagi" onclick="cycleText('usagi')">
                        <div id="bubble-usagi" class="absolute -top-10 -right-4 bg-yellow-50 text-yellow-600 px-3 py-2 rounded-2xl rounded-bl-none text-sm font-bold shadow-sm border border-yellow-100 whitespace-nowrap z-10 transition-all duration-200">
                            Ura!
                        </div>
                        <img 
                            src="https://iili.io/qz563Gt.png" 
                            alt="Usagi" 
                            class="w-20 h-20 rounded-full border-4 border-yellow-200 object-cover shadow-sm pointer-events-none"
                            referrerpolicy="no-referrer"
                        />
                    </div>

                </div>

                <p class="text-xs text-gray-400 italic mb-2">Tap the characters! ✨</p>

                <button 
                    onclick="triggerConfetti()"
                    class="bg-gradient-to-r from-pink-400 to-pink-500 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:shadow-xl btn-bounce flex items-center justify-center gap-2 w-full text-lg"
                >
                    <i data-lucide="gift" class="w-6 h-6"></i>
                    Click for a Surprise!
                </button>
            </div>
        </div>

    </div>

    <script>
        // Generate Floating Hearts
        const heartsContainer = document.getElementById('floating-hearts');
        for(let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.innerHTML = '<i data-lucide="heart" class="w-8 h-8 fill-current"></i>';
            heart.className = 'absolute text-pink-200/50';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animation = `floatUp ${Math.random() * 10 + 10}s linear ${Math.random() * 5}s infinite`;
            heartsContainer.appendChild(heart);
        }

        // Initialize Icons
        lucide.createIcons();

        // Envelope & Card Logic
        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            const card = document.getElementById('card');
            
            envelope.classList.add('envelope-hidden');
            
            setTimeout(() => {
                card.classList.remove('card-wrapper');
                card.classList.add('card-visible');
            }, 300);
        }

        // Character Interactive Logic
        const texts = {
            hachiware: ["Everything will be okay!", "You're the best!", "Have a magical day! ✨"],
            chiikawa: ["Ehehe...", "I love you! 💖", "Happy Birthday! 🎂"],
            usagi: ["Ura!", "Yahha!!", "Woohoo! 🎉"]
        };
        const indices = { hachiware: 0, chiikawa: -1, usagi: 0 };

        function cycleText(char) {
            indices[char] = (indices[char] + 1) % texts[char].length;
            const bubble = document.getElementById(`bubble-${char}`);
            
            // Update text
            bubble.innerText = texts[char][indices[char]];
            
            // Pop animation for the bubble
            bubble.style.opacity = '0';
            bubble.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                bubble.style.opacity = '1';
                bubble.style.transform = 'scale(1)';
            }, 50);
        }

        // Confetti Logic
        function triggerConfetti() {
            const duration = 3000;
            const end = Date.now() + duration;

            const frame = () => {
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.8 },
                    colors: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#ffc0cb']
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.8 },
                    colors: ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#ffc0cb']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            };
            frame();
        }

        // Countdown Logic
        function updateTimer() {
            const now = new Date();
            let targetDate = new Date(now.getFullYear(), 2, 11); // Month is 0-indexed (2 = March)
            
            if (now > targetDate) {
                targetDate = new Date(now.getFullYear() + 1, 2, 11);
            }

            const difference = targetDate.getTime() - now.getTime();

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((difference / 1000 / 60) % 60);
                const seconds = Math.floor((difference / 1000) % 60);

                document.getElementById('days').innerText = days;
                document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
                document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer(); // Initial call
    </script>
</body>
</html>
